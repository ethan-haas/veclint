name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (pinned totals)
        run: |
          python -m pytest tests/ -q --junitxml=results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          s = ET.parse("results.xml").getroot()
          s = s.find("testsuite") if s.tag == "testsuites" else s
          got = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(got)
          # Pinned so a test that silently stops running fails the build.
          assert got == {"tests": 43, "failures": 0, "errors": 0, "skipped": 0}, got
          print("pinned totals match")
          PY

      - name: Two-sided sweep over the generated corpus
        run: |
          python gen_corpus.py --out fixtures
          python - <<'PY'
          import json, subprocess, sys, pathlib
          # Clean indexes must be SILENT; each planted defect must fire exactly
          # its own rule. Without the clean half, a linter that flagged
          # everything would satisfy the detection half alone.
          expected = {
              "clean": (0, set()), "clean_l2": (0, set()), "clean_npy_format": (0, set()),
              "defect_dim_mismatch": (1, {"dimension_mismatch"}),
              "defect_dup_ids": (1, {"duplicate_ids"}),
              "defect_dup_vectors": (1, {"duplicate_vectors"}),
              "defect_metric_mismatch": (1, {"metric_mismatch"}),
              "defect_mixed_norm": (1, {"mixed_normalization"}),
              "defect_nonfinite": (1, {"nonfinite_values"}),
              "defect_orphaned": (1, {"orphaned_vectors"}),
              "defect_stale_ref": (1, {"stale_reference"}),
              "defect_zero_vector": (1, {"zero_vector"}),
              "unsupported_format": (2, None),
          }
          fails = []
          for name, (want_rc, want_rules) in expected.items():
              d = pathlib.Path("fixtures") / name
              p = subprocess.run([sys.executable, "-m", "veclint", "--index-dir", str(d)],
                                 capture_output=True, text=True)
              if p.returncode != want_rc:
                  fails.append(f"{name}: exit {p.returncode} != {want_rc}"); continue
              if want_rules is None:
                  if json.loads(p.stdout).get("status") != "unsupported":
                      fails.append(f"{name}: expected status unsupported")
                  continue
              got = {f["rule_id"] for f in json.loads(p.stdout).get("findings", [])}
              if got != want_rules:
                  fails.append(f"{name}: rules {sorted(got)} != {sorted(want_rules)}")
          assert not fails, fails
          print(f"two-sided sweep OK over {len(expected)} fixtures "
                f"(3 clean silent, 9 defects each firing exactly one rule, 1 unsupported)")
          PY

      - name: Metric-awareness (the over-rejection control)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          # A correct, UNNORMALIZED L2 index must produce zero normalization
          # findings. Rule 1 is the rule most likely to fire on healthy data,
          # so this is the gate that keeps it honest.
          p = subprocess.run([sys.executable, "-m", "veclint", "--index-dir", "fixtures/clean_l2"],
                             capture_output=True, text=True)
          assert p.returncode == 0, p.stdout + p.stderr
          rules = {f["rule_id"] for f in json.loads(p.stdout).get("findings", [])}
          assert "mixed_normalization" not in rules, rules
          print("metric-awareness holds: unnormalized L2 yields no normalization finding")
          PY

      - name: Determinism across processes
        run: |
          python - <<'PY'
          import hashlib, os, subprocess, sys
          digests = set()
          for seed in ("0", "1", "42", "1337"):
              env = dict(os.environ, PYTHONHASHSEED=seed)
              out = subprocess.run([sys.executable, "-m", "veclint",
                                    "--index-dir", "fixtures/defect_mixed_norm"],
                                   capture_output=True, env=env).stdout
              digests.add(hashlib.sha256(out).hexdigest())
          assert len(digests) == 1, f"non-deterministic across hash seeds: {digests}"
          print("byte-identical across 4 PYTHONHASHSEED values")
          PY

      - name: Exit-code contract (0 / 1 / 2)
        run: |
          set +e
          python -m veclint --index-dir fixtures/clean >/dev/null 2>&1
          test $? = 0 || { echo "clean index must exit 0"; exit 1; }
          python -m veclint --index-dir fixtures/defect_dup_ids >/dev/null 2>&1
          test $? = 1 || { echo "findings must exit 1"; exit 1; }
          python -m veclint --index-dir ./no_such_dir >/dev/null 2>&1
          test $? = 2 || { echo "bad input must exit 2"; exit 1; }
          set -e
          echo "exit-code contract holds (0 / 1 / 2 all asserted)"
